<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIU TC Register — 2026-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161A;
    --panel: #1A1F25;
    --panel-2: #202730;
    --line: #2B333C;
    --text: #E9ECEF;
    --muted: #8B95A1;
    --steel: #4C8BC4;
    --steel-dim: #2E4C63;
    --oxide: #C1602E;
    --stamp: #4C9A6A;
    --stamp-dim: #26362B;
    --mono: 'IBM Plex Mono', monospace;
    --disp: 'Oswald', sans-serif;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);}
  body{min-height:100vh;}

  /* Header */
  .head{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 14px),
      linear-gradient(180deg,#171C21,#12161A);
    border-bottom:2px solid var(--steel-dim);
    padding:22px 24px 18px;
    position:relative;
  }
  .head-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:44px;height:44px;border:2px solid var(--steel);border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:0.5px;
    color:var(--steel); background:var(--steel-dim); flex-shrink:0;
    transform:rotate(-2deg);
  }
  h1{
    font-family:var(--disp); font-weight:600; font-size:26px; letter-spacing:0.5px;
    margin:0; text-transform:uppercase; line-height:1.1;
  }
  .sub{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:4px; letter-spacing:0.3px;}
  .stat-strip{display:flex; gap:22px; font-family:var(--mono); font-size:12px; color:var(--muted);}
  .stat-strip b{color:var(--text); font-size:18px; font-family:var(--disp); font-weight:600; display:block;}

  /* Controls */
  .controls{
    padding:16px 24px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; position:sticky; top:0; z-index:20;
  }
  .search-wrap{position:relative; flex:1 1 260px; min-width:200px;}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.5;}
  input[type=text], select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:5px; padding:9px 12px; font-family:var(--body); font-size:13.5px;
    outline:none;
  }
  input[type=text]{width:100%; padding-left:34px;}
  input[type=text]:focus, select:focus{border-color:var(--steel);}
  select{cursor:pointer; min-width:140px;}
  .chip{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    border:1px solid var(--line); padding:5px 10px; border-radius:20px; cursor:pointer;
    background:var(--panel-2); user-select:none; white-space:nowrap;
  }
  .chip.active{border-color:var(--stamp); color:var(--stamp); background:var(--stamp-dim);}
  .reset-btn{
    font-family:var(--mono); font-size:11px; color:var(--oxide); background:none;
    border:1px solid var(--oxide); border-radius:5px; padding:8px 12px; cursor:pointer;
  }

  /* Table */
  .table-wrap{padding:0 24px 40px; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; margin-top:14px; min-width:1180px;}
  thead th{
    text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:0.6px;
    color:var(--muted); text-transform:uppercase; padding:10px 12px; border-bottom:1px solid var(--steel-dim);
    position:sticky; top:64px; background:var(--bg); z-index:10; white-space:nowrap;
  }
  tbody td{
    padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; white-space:nowrap;
  }
  tbody tr{transition:background 0.1s;}
  tbody tr:hover{background:var(--panel);}
  .mono{font-family:var(--mono); font-size:12.5px;}
  .party{color:var(--text); font-weight:500;}
  .muted{color:var(--muted);}
  .qty{font-family:var(--mono); color:var(--steel);}

  /* Stamp button */
  .stamp-btn{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px;
    padding:5px 10px; border-radius:4px; border:1.5px solid var(--stamp); color:var(--stamp);
    background:var(--stamp-dim); text-decoration:none; cursor:pointer; letter-spacing:0.4px;
    transform:rotate(-1deg);
  }
  .stamp-btn:hover{background:var(--stamp); color:#0D140F;}
  .stamp-btn.missing{
    border-color:var(--line); color:var(--muted); background:none; cursor:default; transform:none;
  }
  .stamp-btn.missing:hover{background:none; color:var(--muted);}

  /* Empty / footer */
  .empty{padding:60px 24px; text-align:center; color:var(--muted); font-family:var(--mono); font-size:13px;}
  .footer-bar{
    padding:12px 24px; font-family:var(--mono); font-size:11px; color:var(--muted);
    display:flex; justify-content:space-between; border-top:1px solid var(--line); flex-wrap:wrap; gap:8px;
  }
  .page-controls{display:flex; gap:6px; align-items:center;}
  .page-controls button{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:4px;
    padding:5px 10px; cursor:pointer; font-family:var(--mono); font-size:11px;
  }
  .page-controls button:disabled{opacity:0.35; cursor:not-allowed;}

  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  @media (max-width:640px){
    .head{padding:16px 14px;}
    h1{font-size:19px;}
    .stat-strip{gap:14px;}
    .controls, .table-wrap, .footer-bar{padding-left:14px; padding-right:14px;}
    thead th{top:58px;}
  }
</style>
</head>

/* ====== CONFIG ====== */
const PDF_FOLDER = "tc-pdfs/"; // PDFs must be named exactly by TC NO, e.g. 1.pdf, 560A.pdf
const PAGE_SIZE = 60;

const headers = TC_DATA.headers;
const idx = {};
headers.forEach((h,i)=> idx[h]=i);

const rows = TC_DATA.rows.map(r => ({raw:r}));

let filtered = rows;
let currentPage = 1;
let tcOnly = false;

/* Populate dropdown filters */
function uniqueVals(colIdx){
  const set = new Set();
  rows.forEach(r=>{ const v = r.raw[colIdx]; if(v!==null && v!=='') set.add(String(v)); });
  return [...set].sort();
}
function fillSelect(selectEl, values){
  values.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    selectEl.appendChild(opt);
  });
}
fillSelect(document.getElementById('partyFilter'), uniqueVals(idx['Party Name']));
fillSelect(document.getElementById('gradeFilter'), uniqueVals(idx['Grade']));
fillSelect(document.getElementById('typeFilter'), uniqueVals(idx['Type']));

/* Stats */
document.getElementById('statTotal').textContent = rows.length.toLocaleString('en-IN');
document.getElementById('statCertified').textContent = rows.filter(r=> r.raw[idx['TC NO']] !== null && r.raw[idx['TC NO']] !== '').length.toLocaleString('en-IN');
document.getElementById('statParties').textContent = uniqueVals(idx['Party Name']).length;

/* Table header */
const displayCols = ['Date','Vehicle No.','Party Name','Make','Invoice No.','Grade','Heat No.','Type','Size','Qty.','TC NO'];
const theadRow = document.getElementById('theadRow');
displayCols.forEach(c=>{
  const th = document.createElement('th');
  th.textContent = c === 'TC NO' ? 'Certificate' : c;
  theadRow.appendChild(th);
});

function pdfUrlFor(tcno){
  return PDF_FOLDER + encodeURIComponent(String(tcno).trim()) + ".pdf";
}

function renderTable(){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const start = (currentPage-1)*PAGE_SIZE;
  const pageRows = filtered.slice(start, start+PAGE_SIZE);

  if(filtered.length === 0){
    document.getElementById('emptyState').style.display = 'block';
  } else {
    document.getElementById('emptyState').style.display = 'none';
  }

  pageRows.forEach(r=>{
    const raw = r.raw;
    const tr = document.createElement('tr');

    const tcVal = raw[idx['TC NO']];
    const cellsHtml = [
      `<td class="mono muted">${raw[idx['Date']] ?? '—'}</td>`,
      `<td class="mono">${raw[idx['Vehicle No.']] ?? '—'}</td>`,
      `<td class="party">${raw[idx['Party Name']] ?? '—'}</td>`,
      `<td class="muted">${raw[idx['Make']] ?? '—'}</td>`,
      `<td class="mono">${raw[idx['Invoice No.']] ?? '—'}</td>`,
      `<td class="mono">${raw[idx['Grade']] ?? '—'}</td>`,
      `<td class="mono">${raw[idx['Heat No.']] ?? '—'}</td>`,
      `<td>${raw[idx['Type']] ?? '—'}</td>`,
      `<td class="mono muted">${raw[idx['Size']] ?? '—'}</td>`,
      `<td class="qty">${raw[idx['Qty.']] ?? '—'}</td>`,
    ].join('');
    tr.innerHTML = cellsHtml;

    const tcTd = document.createElement('td');
    if(tcVal !== null && tcVal !== ''){
      const a = document.createElement('a');
      a.className = 'stamp-btn';
      a.href = pdfUrlFor(tcVal);
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> TC ${tcVal}`;
      tcTd.appendChild(a);
    } else {
      const span = document.createElement('span');
      span.className = 'stamp-btn missing';
      span.textContent = 'No TC';
      tcTd.appendChild(span);
    }
    tr.appendChild(tcTd);
    tbody.appendChild(tr);
  });

  const rangeStart = filtered.length ? start+1 : 0;
  const rangeEnd = Math.min(start+PAGE_SIZE, filtered.length);
  document.getElementById('rangeLabel').textContent = `Showing ${rangeStart}–${rangeEnd} of ${filtered.length.toLocaleString('en-IN')}`;
  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  document.getElementById('pageLabel').textContent = `Page ${currentPage} / ${totalPages}`;
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages;
}

function applyFilters(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const party = document.getElementById('partyFilter').value;
  const grade = document.getElementById('gradeFilter').value;
  const type = document.getElementById('typeFilter').value;

  filtered = rows.filter(r=>{
    const raw = r.raw;
    if(party && String(raw[idx['Party Name']]) !== party) return false;
    if(grade && String(raw[idx['Grade']]) !== grade) return false;
    if(type && String(raw[idx['Type']]) !== type) return false;
    if(tcOnly && (raw[idx['TC NO']] === null || raw[idx['TC NO']] === '')) return false;
    if(q){
      const hay = [raw[idx['Vehicle No.']], raw[idx['Party Name']], raw[idx['Invoice No.']],
                   raw[idx['Heat No.']], raw[idx['Size']], raw[idx['TC NO']], raw[idx['Grade']],
                   raw[idx['Make']]].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  currentPage = 1;
  renderTable();
}

document.getElementById('searchBox').addEventListener('input', applyFilters);
document.getElementById('partyFilter').addEventListener('change', applyFilters);
document.getElementById('gradeFilter').addEventListener('change', applyFilters);
document.getElementById('typeFilter').addEventListener('change', applyFilters);
document.getElementById('tcOnlyChip').addEventListener('click', ()=>{
  tcOnly = !tcOnly;
  document.getElementById('tcOnlyChip').classList.toggle('active', tcOnly);
  applyFilters();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  document.getElementById('searchBox').value='';
  document.getElementById('partyFilter').value='';
  document.getElementById('gradeFilter').value='';
  document.getElementById('typeFilter').value='';
  tcOnly = false;
  document.getElementById('tcOnlyChip').classList.remove('active');
  applyFilters();
});
document.getElementById('prevBtn').addEventListener('click', ()=>{ if(currentPage>1){currentPage--; renderTable();}});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  if(currentPage<totalPages){currentPage++; renderTable();}
});

renderTable();
</script>
